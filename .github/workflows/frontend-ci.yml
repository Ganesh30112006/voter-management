# CI for the frontend on every push and pull request: type check, tests and the production build.
# Deployment (CD) is done by AWS Amplify Hosting, which builds amplify.yml on every push to the connected branch.
name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # CD: after the checks pass on main, build against the production API and publish to AWS Amplify.
  # AWS access is through GitHub OIDC (no AWS keys in GitHub); the role can only deploy this Amplify app.
  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN || 'arn:aws:iam::492462083767:role/voterdesk-frontend-deploy' }}
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
      AMPLIFY_APP_ID: ${{ vars.AMPLIFY_APP_ID || 'd1il8v95socjri' }}
      # The API on the custom domain (CloudFront E3NW6NPUQSE0HH; d37boaln3snj1u.cloudfront.net still works).
      VITE_API_BASE_URL: https://api.barakagroupofservice.live/api
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: cd dist && zip -qr ../site.zip .
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Publish to Amplify
        run: |
          read -r JOB URL <<<"$(aws amplify create-deployment --app-id "$AMPLIFY_APP_ID" --branch-name main --query '[jobId,zipUploadUrl]' --output text)"
          curl -fsS -X PUT -H "Content-Type: application/zip" --data-binary @site.zip "$URL"
          aws amplify start-deployment --app-id "$AMPLIFY_APP_ID" --branch-name main --job-id "$JOB" > /dev/null
          for i in $(seq 1 60); do
            STATUS=$(aws amplify get-job --app-id "$AMPLIFY_APP_ID" --branch-name main --job-id "$JOB" --query 'job.summary.status' --output text)
            echo "Amplify job $JOB: $STATUS"
            [ "$STATUS" = "SUCCEED" ] && exit 0
            [ "$STATUS" = "FAILED" ] || [ "$STATUS" = "CANCELLED" ] && exit 1
            sleep 5
          done
          exit 1
